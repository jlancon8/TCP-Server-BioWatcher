stages:
  - build
  - test
  - package
  - integration
  - docs
  - deploy
  - release

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - when: always

variables:
  MAVEN_OPTS: "-Dmaven.repo.local=$CI_PROJECT_DIR/.m2/repository"
  MAVEN_CLI_OPTS: "-B --no-transfer-progress"
  MAVEN_IMAGE: "maven:3.9-eclipse-temurin-21"
  API_PORT: "4567"

.version: &version
  - export VERSION="${CI_COMMIT_TAG#v}"
  - if [ -z "$VERSION" ]; then export VERSION="0.1.0-${CI_COMMIT_SHORT_SHA}"; fi
  - echo "version = $VERSION"

.maven:
  image: $MAVEN_IMAGE
  cache:
    key:
      files: [pom.xml, server/pom.xml]
    paths: [.m2/repository]
  before_script:
    - *version

.on_main_or_tag:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.release_tag:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/

compile:
  extends: .maven
  stage: build
  script:
    - mvn $MAVEN_CLI_OPTS -Drevision=$VERSION compile

acceptance-tests:
  extends: .maven
  stage: test
  needs: [compile]
  services:
    - name: mongo:7
      alias: mongo
  variables:
    MONGO_URL: "mongodb://mongo:27017"
  script:
    - mvn $MAVEN_CLI_OPTS -Drevision=$VERSION test
  artifacts:
    when: always
    reports:
      junit: server/target/surefire-reports/TEST-*.xml
    paths: [server/target/surefire-reports/]
    expire_in: 1 week

package:
  extends: .maven
  stage: package
  needs: [acceptance-tests]
  script:
    - mvn $MAVEN_CLI_OPTS -Drevision=$VERSION -DskipTests package
    - mkdir -p dist
    - cp server/target/biowatcher-tcp-server-$VERSION.jar client/target/biowatcher-tcp-client-$VERSION.jar dist/
    - echo "$VERSION" > dist/VERSION
    - ls -l dist
  artifacts:
    name: "biowatcher-tcp-$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA"
    paths: [dist/]
    expire_in: 30 days

.e2e:
  image: eclipse-temurin:21-jdk
  stage: integration
  needs: [package]
  before_script:
    - apt-get update -qq && apt-get install -y -qq socat curl > /dev/null
    - socat TCP-LISTEN:27017,fork,reuseaddr TCP:mongo:27017 &
  artifacts:
    when: always
    paths: [server.log]
    expire_in: 1 week

e2e-smoke:
  extends: .e2e
  services:
    - name: mongo:7
      alias: mongo
  script:
    - ci/smoke-test.sh dist/biowatcher-tcp-server-*.jar 5000

e2e-full:
  extends: .e2e
  rules:
    - if: $API_IMAGE
  variables:
    FF_NETWORK_PER_BUILD: "true"
    MONGO_URL: "mongodb://mongo:27017/weatherapi"
    MONGODB_URI: "mongodb://mongo:27017/weatherapi"
    PORT: "$API_PORT"
  services:
    - name: mongo:7
      alias: mongo
    - name: $API_IMAGE
      alias: api
  script:
    - socat TCP-LISTEN:4567,fork,reuseaddr TCP:api:$API_PORT &
    - |
      for i in $(seq 1 60); do
        curl -s -o /dev/null http://localhost:4567/ && break
        echo "attente de l'API ($i)..."; sleep 2
      done
    - WITH_API=true ci/smoke-test.sh dist/biowatcher-tcp-server-*.jar 5000

javadoc:
  extends: .maven
  stage: docs
  needs: [compile]
  script:
    - mvn $MAVEN_CLI_OPTS -Drevision=$VERSION javadoc:aggregate
  artifacts:
    paths: [target/reports/apidocs/]
    expire_in: 30 days

pages:
  stage: deploy
  image: alpine:3.20
  extends: .on_main_or_tag
  needs: [package, javadoc, e2e-smoke]
  variables:
    COMMIT_SHA: $CI_COMMIT_SHORT_SHA
    REPO_URL: $CI_PROJECT_URL
    PIPELINE_URL: $CI_PIPELINE_URL
  script:
    - export VERSION=$(cat dist/VERSION)
    - sh ci/build-pages.sh
  artifacts:
    paths: [public]
  environment:
    name: pages
    url: $CI_PAGES_URL

docker-image:
  stage: deploy
  image: docker:27
  services: [docker:27-dind]
  extends: .on_main_or_tag
  needs: [acceptance-tests]
  allow_failure: true
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
    - docker build -t "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" .
    - docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
    - |
      if [ -n "$CI_COMMIT_TAG" ]; then
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
        docker push "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG"
      else
        docker tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA" "$CI_REGISTRY_IMAGE:latest"
        docker push "$CI_REGISTRY_IMAGE:latest"
      fi

trigger-integration:
  stage: deploy
  needs: [docker-image]
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline"
      when: never
    - if: $INTEGRATION_PROJECT && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  variables:
    UPSTREAM_COMPONENT: "tcp-server"
    TCP_SERVER_IMAGE: "$CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA"
  trigger:
    project: $INTEGRATION_PROJECT
    branch: main
    strategy: depend

upload-release-assets:
  stage: release
  image: curlimages/curl:8.10.1
  extends: .release_tag
  needs: [package, e2e-smoke]
  variables:
    PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/biowatcher-tcp/${CI_COMMIT_TAG}"
  script:
    - |
      V=$(cat dist/VERSION)
      for kind in server client; do
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" \
             --upload-file "dist/biowatcher-tcp-$kind-$V.jar" \
             "$PACKAGE_URL/biowatcher-tcp-$kind-$CI_COMMIT_TAG.jar"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  extends: .release_tag
  needs: [upload-release-assets]
  variables:
    PACKAGE_URL: "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/biowatcher-tcp/${CI_COMMIT_TAG}"
  script:
    - echo "création de la release $CI_COMMIT_TAG"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "BioWatcher TCP $CI_COMMIT_TAG"
    description: "Serveur TCP de centralisation BioWatcher $CI_COMMIT_TAG. Documentation : $CI_PAGES_URL"
    assets:
      links:
        - name: "biowatcher-tcp-server-$CI_COMMIT_TAG.jar"
          url: "$PACKAGE_URL/biowatcher-tcp-server-$CI_COMMIT_TAG.jar"
          link_type: package
        - name: "biowatcher-tcp-client-$CI_COMMIT_TAG.jar"
          url: "$PACKAGE_URL/biowatcher-tcp-client-$CI_COMMIT_TAG.jar"
          link_type: package
        - name: "Javadoc"
          url: "$CI_PAGES_URL/javadoc/"
          link_type: other
