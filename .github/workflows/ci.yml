name: CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  repository_dispatch:
    types: [component-updated]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  MAVEN_CLI_OPTS: -B --no-transfer-progress

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then V="${GITHUB_REF_NAME#v}"; else V="0.1.0-${GITHUB_SHA::8}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "version = $V"

  build:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn $MAVEN_CLI_OPTS -Drevision=${{ needs.version.outputs.version }} compile

  acceptance-tests:
    needs: [version, build]
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      MONGO_URL: mongodb://localhost:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn $MAVEN_CLI_OPTS -Drevision=${{ needs.version.outputs.version }} test
      - name: Résumé des tests
        if: always()
        run: |
          echo "### Tests d'acceptation" >> "$GITHUB_STEP_SUMMARY"
          grep -h "Tests run" server/target/surefire-reports/*.txt | sed 's/^/- /' >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: acceptance-test-reports
          path: server/target/surefire-reports/

  package:
    needs: [version, acceptance-tests]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn $MAVEN_CLI_OPTS -Drevision=$VERSION -DskipTests package
      - run: |
          mkdir -p dist
          cp server/target/biowatcher-tcp-server-$VERSION.jar client/target/biowatcher-tcp-client-$VERSION.jar dist/
          echo "$VERSION" > dist/VERSION
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: biowatcher-tcp-${{ needs.version.outputs.version }}
          path: dist/
          retention-days: 30

  javadoc:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21", cache: maven }
      - run: mvn $MAVEN_CLI_OPTS -Drevision=${{ needs.version.outputs.version }} javadoc:aggregate
      - uses: actions/upload-artifact@v4
        with:
          name: javadoc
          path: target/reports/apidocs/

  docker-image:
    if: github.event_name == 'push'
    needs: [acceptance-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build -t "$IMAGE:${GITHUB_SHA::8}" .
          docker push "$IMAGE:${GITHUB_SHA::8}"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG=latest; fi
          docker tag "$IMAGE:${GITHUB_SHA::8}" "$IMAGE:$TAG"
          docker push "$IMAGE:$TAG"

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, package, javadoc]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: "biowatcher-tcp-${{ needs.version.outputs.version }}", path: dist }
      - uses: actions/download-artifact@v4
        with: { name: javadoc, path: target/reports/apidocs }
      - run: sh ci/build-pages.sh
        env:
          VERSION: ${{ needs.version.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          PIPELINE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: public }
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [version, package, acceptance-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Vérification du format du tag
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag $GITHUB_REF_NAME ignoré (attendu vX.Y.Z)"; exit 1; }
      - uses: actions/download-artifact@v4
        with: { name: "biowatcher-tcp-${{ needs.version.outputs.version }}", path: dist }
      - run: |
          gh release create "$GITHUB_REF_NAME" dist/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --title "BioWatcher TCP $GITHUB_REF_NAME" \
            --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-components:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DOWNSTREAM_REPOS != ''
    needs: [docker-image]
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.COMPONENTS_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then echo "secret COMPONENTS_TOKEN absent, rien à faire"; exit 0; fi
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA::8}"
          for repo in ${{ vars.DOWNSTREAM_REPOS }}; do
            echo "-> $repo"
            gh api "repos/$repo/dispatches" -f event_type=component-updated \
              -F "client_payload[component]=tcp-server" -F "client_payload[tcp_server_image]=$IMAGE"
          done